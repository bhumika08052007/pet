<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pet Shop - Buy Dog Food, Cat Food & Pet Accessories</title>

<meta name="description" content="Best pet shop for dog food, cat food, toys and accessories. Affordable and high-quality products for your pets.">

<meta name="keywords" content="pet shop, dog food, cat food, pet toys, pet accessories">

<meta name="author" content="Pet Shop">

<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Segoe UI',sans-serif;background:#fffafc;}

header{
display:flex;justify-content:space-between;align-items:center;
padding:18px 60px;
background:linear-gradient(90deg,#ff9a9e,#fad0c4);
box-shadow:0 3px 10px rgba(0,0,0,0.1);
position:sticky;top:0;
}

.logo{display:flex;align-items:center;font-size:26px;font-weight:bold;}
.logo img{width:45px;margin-right:10px;}

nav a{margin:18px;text-decoration:none;color:#333;font-weight:bold;}
nav a:hover{color:#ff4d6d;}

.hero{
height:90vh;
background:linear-gradient(rgba(0,0,0,0.4),rgba(0,0,0,0.4)),
url("https://images.unsplash.com/photo-1543466835-00a7907e9de1");
background-size:cover;background-position:center;
display:flex;flex-direction:column;justify-content:center;align-items:center;
color:white;text-align:center;
}

.hero h1{font-size:65px;}
.hero p{font-size:22px;margin:20px;}

.hero button{
padding:14px 35px;border:none;background:#ff4d6d;
color:white;font-size:18px;border-radius:30px;cursor:pointer;
}

.products{padding:70px;text-align:center;}

.product-container{
display:flex;justify-content:center;gap:30px;flex-wrap:wrap;margin-top:40px;
}

.card{
width:250px;background:white;border-radius:15px;
overflow:hidden;box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

.card img{width:100%;height:200px;object-fit:cover;}
.card h3{margin:12px;}
.card p{padding:0 15px 20px;}

footer{
background:#333;color:white;text-align:center;
padding:25px;margin-top:40px;
}
</style>

<script>
function goToShop(){
window.location.href="Shop.html";
}

async function loadProducts() {
  const res = await fetch("https://yourname.infinityfreeapp.com/get_products.html");
  const data = await res.json();

  const container = document.getElementById("products");
  container.innerHTML = "";

  data.forEach(p => {
    container.innerHTML += `
      <div class="card">
        <img src="${p.image}" alt="${p.name}">
        <h3>${p.name}</h3>
        <p>${p.description}</p>
        <p>₹${p.price}</p>
      </div>
    `;
  });
}

window.onload = loadProducts;
</script>

</head>

<body>

<header>
<div class="logo">
<img src="https://cdn-icons-png.flaticon.com/512/616/616408.png" alt="Pet Shop Logo">
Pet Shop
</div>

<nav>
<a href="index.html">Home</a>
<a href="#">Portfolio</a>
<a href="#">Blog</a>
<a href="Shop.html">Shop</a>
<a href="#">Contacts</a>
</nav>
</header>

<section class="hero">
<h1>Welcome To Pet Shop 🐾</h1>
<p>The best place for your lovely pets 🐶🐱</p>
<button onclick="goToShop()">Explore Now</button>
</section>

<section class="products">
<h2>Popular Products</h2>
<div class="product-container" id="products"></div>
</section>

<footer>
<p>© 2026 Pet Shop Website | All Rights Reserved</p>
</footer>

</body>
</html>
